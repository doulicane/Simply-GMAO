# =============================================================================
# Configuration Nginx — Reverse Proxy GMAO Ramondin
# =============================================================================
# - Redirection HTTP -> HTTPS
# - Proxy vers l'API Node.js (port 3000)
# - Servir les fichiers uploads directement
# - Compression gzip
# - Headers de securite
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # -------------------------------------------------------------------------
    # Compression gzip
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Limite de taille pour uploads (doit correspondre a MAX_FILE_SIZE API)
    # -------------------------------------------------------------------------
    client_max_body_size 50M;

    # -------------------------------------------------------------------------
    # Upstream API
    # -------------------------------------------------------------------------
    upstream api_backend {
        server api:3000;
    }

    # -------------------------------------------------------------------------
    # HTTP — Redirection vers HTTPS
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS — Reverse proxy principal
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name gmao.ramondin.local;

        # Certificats (auto-signes ou CA interne)
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # SSL parameters
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # -------------------------------------------------------------------
        # Headers de securite
        # -------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # -------------------------------------------------------------------
        # Fichiers uploads (servis directement par Nginx)
        # -------------------------------------------------------------------
        location /uploads/ {
            alias /data/uploads/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri $uri/ =404;
        }

        # -------------------------------------------------------------------
        # API — Proxy vers Node.js
        # -------------------------------------------------------------------
        location /api/ {
            proxy_pass http://api_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # -------------------------------------------------------------------
        # Healthcheck Nginx
        # -------------------------------------------------------------------
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # -------------------------------------------------------------------
        # Frontend SPA (fallback sur index.html)
        # -------------------------------------------------------------------
        location / {
            proxy_pass http://api_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
