# =============================================================================
# GitHub Actions — CI/CD Pipeline
# =============================================================================

name: CI/CD GMAO Simply GMAO

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            app/backend/package-lock.json

      - name: Install frontend
        run: cd app && npm ci
      - name: Install backend
        run: cd app/backend && npm ci

      - name: Frontend typecheck
        run: cd app && npx tsc --noEmit
      - name: Backend typecheck
        run: cd app/backend && npx tsc --noEmit

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simply-gmao
          POSTGRES_PASSWORD: simply-gmao2025
          POSTGRES_DB: simply-gmao_gmao_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/backend/package-lock.json
      - name: Install backend
        run: cd app/backend && npm ci
      - name: Run migrations
        run: cd app/backend && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://simply-gmao:simply-gmao2025@localhost:5432/simply-gmao_gmao_test?schema=public
          REDIS_URL: redis://localhost:6379
      - name: Seed DB
        run: cd app/backend && npx prisma db seed
        env:
          DATABASE_URL: postgresql://simply-gmao:simply-gmao2025@localhost:5432/simply-gmao_gmao_test?schema=public
          REDIS_URL: redis://localhost:6379
      - name: Run tests
        run: cd app/backend && npm run test
        env:
          DATABASE_URL: postgresql://simply-gmao:simply-gmao2025@localhost:5432/simply-gmao_gmao_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_secret_key_very_long_32_chars_minimum_here
          NODE_ENV: test

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install frontend
        run: cd app && npm ci
      - name: Run unit tests
        run: cd app && npm test

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install frontend
        run: cd app && npm ci
      - name: Build frontend
        run: cd app && npm run build
