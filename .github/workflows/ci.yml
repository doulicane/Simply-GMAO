# =============================================================================
# GitHub Actions — CI/CD Pipeline
# =============================================================================

name: CI/CD GMAO Simply GMAO

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            app/backend/package-lock.json

      - name: Install frontend
        run: cd app && npm ci
      - name: Install backend
        run: cd app/backend && npm ci

      - name: Frontend typecheck
        run: cd app && npx tsc --noEmit
      - name: Backend typecheck
        run: cd app/backend && npx tsc --noEmit

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/backend/package-lock.json
      - name: Install backend
        run: cd app/backend && npm ci
      - name: Run tests
        run: cd app/backend && npm run test
        env:
          JWT_SECRET: ci_test_secret_key_very_long_32_chars_minimum_here
          NODE_ENV: test

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install frontend
        run: cd app && npm ci
      - name: Run unit tests
        run: cd app && npm test

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install frontend
        run: cd app && npm ci
      - name: Build frontend
        run: cd app && npm run build
