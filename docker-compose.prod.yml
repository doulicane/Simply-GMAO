# =============================================================================
# Docker Compose — GMAO Simply GMAO (Production)
# =============================================================================

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gmao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-simply-gmao}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-simply-gmao_gmao}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-simply-gmao} -d ${DB_NAME:-simply-gmao_gmao}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gmao-network
    logging:
      driver: json-file
      options:
        max-size: "100M"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: gmao-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gmao-network
    logging:
      driver: json-file
      options:
        max-size: "100M"
        max-file: "5"

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: gmao-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-simply-gmao}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-simply-gmao_gmao}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: info
      PREVENTIVE_CRON: ${PREVENTIVE_CRON:-0 7 * * *}
      STOCK_ALERT_CRON: ${STOCK_ALERT_CRON:-0 8 * * *}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - uploads_data:/data/uploads
      - ./app/backend/logs:/app/logs
    networks:
      - gmao-network
    logging:
      driver: json-file
      options:
        max-size: "100M"
        max-file: "5"

  nginx:
    image: nginx:alpine
    container_name: gmao-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - gmao-network
    logging:
      driver: json-file
      options:
        max-size: "100M"
        max-file: "5"

  watchtower:
    image: containrrr/watchtower
    container_name: gmao-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 3600
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_ROLLING_RESTART: "true"
    networks:
      - gmao-network
    logging:
      driver: json-file
      options:
        max-size: "50M"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  gmao-network:
    driver: bridge
