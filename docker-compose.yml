# =============================================================================
# Docker Compose — GMAO Simply GMAO (Development)
# =============================================================================

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gmao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: simply-gmao
      POSTGRES_PASSWORD: simply-gmao2025
      POSTGRES_DB: simply-gmao_gmao
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/backend/backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simply-gmao -d simply-gmao_gmao"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gmao-network
    logging:
      driver: json-file
      options:
        max-size: "100M"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: gmao-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gmao-network
    logging:
      driver: json-file
      options:
        max-size: "100M"
        max-file: "5"

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: gmao-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://simply-gmao:simply-gmao2025@postgres:5432/simply-gmao_gmao?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-changez_cette_cle_pour_une_cle_securisee_de_32_caracteres_minimum}
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: info
    ports:
      - "3001:3000"
    volumes:
      - uploads_data:/data/uploads
      - ./app/backend/logs:/app/logs
    networks:
      - gmao-network
    logging:
      driver: json-file
      options:
        max-size: "100M"
        max-file: "5"

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  gmao-network:
    driver: bridge
